<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PetFeed</title>
<meta name="description" content="PetFeed: a web-based point-of-sale and inventory management system (prototype, M1)">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== 1. STYLES (colors as tokens so light/dark both work) ===== */
:root{--teal:#0a6b69;--teal2:#085452;--orange:#f4a23a;--bg:#f5f5f5;--card:#fff;--ink:#1d2b29;--mut:#6b7775;--line:#dfe3e2;--sel:#e6f0ef;
 --red:#9b1c1c;--redbg:#fbdcdc;--grn:#1f6b36;--grnbg:#dcf0e0;--amb:#8a5200;--ambbg:#fbeacb;--gry:#e3e8e7;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a19;--card:#1b2625;--ink:#e8efee;--mut:#9aa9a7;--line:#2f3d3b;--sel:#22403e;--redbg:#4a2222;--grnbg:#1f3d2a;--ambbg:#4a3a1c;--gry:#2a3735;--red:#f2a0a0;--grn:#8fd6a3;--amb:#f0c27a}}
:root[data-theme="dark"]{--bg:#121a19;--card:#1b2625;--ink:#e8efee;--mut:#9aa9a7;--line:#2f3d3b;--sel:#22403e;--redbg:#4a2222;--grnbg:#1f3d2a;--ambbg:#4a3a1c;--gry:#2a3735;--red:#f2a0a0;--grn:#8fd6a3;--amb:#f0c27a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Nunito,"Segoe UI",system-ui,sans-serif;font-size:15px}
h1{font-size:28px;margin:0 0 4px}h2{font-size:18px;margin:0 0 10px}
a{color:var(--teal);font-weight:700;text-decoration:none}
.mut{color:var(--mut);margin:0}
label{display:block;font-weight:700;margin:14px 0 6px}
input,select{width:100%;padding:12px 14px;border:1px solid #8a9997;border-radius:12px;font:inherit;background:var(--card);color:var(--ink)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.hint{font-size:12.5px;color:var(--mut);margin:5px 0 0}
.btn{background:var(--teal);color:#fff;border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:800;cursor:pointer}
.btn:hover{background:var(--teal2)}.btn.full{width:100%;margin-top:18px}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--card);color:var(--red);border:1px solid var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.note{min-height:20px;margin:12px 0 0;font-weight:700;font-size:14px}.note.err{color:var(--red)}.note.ok{color:var(--grn)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;background:var(--gry)}
.pill.g{background:var(--grnbg);color:var(--grn)}.pill.a{background:var(--ambbg);color:var(--amb)}.pill.r{background:var(--redbg);color:var(--red)}.pill.x{background:var(--red);color:#fff}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}.tabs a{color:var(--mut);padding:10px 2px;border-bottom:3px solid transparent}.tabs a.on{color:var(--teal);border-color:var(--teal)}
.tag{background:var(--gry);border-radius:99px;padding:2px 8px;font-size:11px;color:var(--ink)}
.filters{display:grid;grid-template-columns:1fr 200px 200px;gap:10px;margin-bottom:14px}.bat{display:flex;justify-content:space-between;gap:8px;background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px}
@media (max-width:860px){.filters{grid-template-columns:1fr}}
.lg{display:inline-flex;width:42px;height:42px;border-radius:12px;background:var(--orange);align-items:center;justify-content:center}
.brand{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:800}
/* Login: split layout */
.split{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.split .left{background:var(--teal);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.split .left h2{font-size:42px;line-height:1.15;margin:0 0 14px}
.split .left ul{list-style:none;padding:0;margin:20px 0 0}.split .left li{margin:10px 0;font-weight:700}
.split .left li:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--orange);margin-right:12px}
.split .right{display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:420px}
.center{max-width:460px;margin:0 auto;padding:36px 16px}.center .brand{justify-content:center;margin-bottom:22px}
.eye{position:absolute;right:12px;top:34px;background:none;border:0;cursor:pointer;color:var(--mut);padding:4px}
.banner{background:var(--ambbg);color:var(--amb);border-radius:12px;padding:14px;font-weight:800;margin-bottom:14px}
.staffbox{background:var(--bg);border-radius:12px;padding:14px;margin:14px 0}
.code{font-size:26px;font-weight:800;letter-spacing:2px;text-align:center;background:var(--bg);border:2px dashed var(--teal);border-radius:12px;padding:18px;margin:14px 0;word-break:break-all}
/* App shell */
.shell{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
aside{background:var(--teal);color:#fff;padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
aside .brand{font-size:22px;margin:0 6px 24px}
aside nav{flex:1}
aside a{display:block;color:#fff;padding:11px 14px;border-radius:12px;margin-bottom:4px}
aside a.on{background:#fff;color:#12312f}
aside .foot span{display:block;padding:6px 14px;font-weight:700;font-size:14px}
main{padding:28px;min-width:0}
.two{display:grid;grid-template-columns:1fr 330px;gap:24px;align-items:start}
.hd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap}
.tbl{padding:0;overflow-x:auto}table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mut);font-size:13px;padding:12px 16px;border-bottom:1px solid var(--line)}
td{padding:14px 16px;border-bottom:1px solid var(--line)}tr.row{cursor:pointer}tr.sel td{background:var(--sel)}
.kv{display:flex;justify-content:space-between;padding:7px 0}.kv span{color:var(--mut)}
.form{max-width:640px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}.pc:hover{border-color:var(--teal)}.pc[disabled]{opacity:.55;cursor:not-allowed}.pc small{color:var(--mut);font-weight:700}.pc b{display:block;margin:4px 0 6px}.pc .pr{color:var(--teal);font-size:20px;font-weight:800}
.ln{display:grid;grid-template-columns:1fr auto 84px;gap:10px;align-items:center;padding:10px 0}.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:800;cursor:pointer}.seg button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.chg{background:var(--sel);border-radius:12px;padding:12px;display:flex;justify-content:space-between;font-weight:800;margin-top:10px}
.rcpt{background:#fff;color:#000;width:300px;max-width:100%;padding:22px 18px;border:1px solid #ccc;font-family:"Courier New",monospace;font-size:13px}.rcpt .r{display:flex;justify-content:space-between;gap:8px}.rcpt hr{border:0;border-top:1px dashed #000;margin:10px 0}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}.cards3 b{display:block;font-size:24px;margin-top:4px}
.two.sellg{grid-template-columns:1fr 360px}
@media (max-width:860px){.two.sellg{grid-template-columns:1fr}.cards3{grid-template-columns:1fr}}
@media (max-width:860px){
 .split{grid-template-columns:1fr}.split .left{display:none}
 .shell{grid-template-columns:1fr}
 aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px}
 aside .brand{margin:0 8px 0 0}aside nav{display:flex;flex-wrap:wrap;gap:4px;flex:1 1 100%;order:3}
 aside .foot{display:flex;flex-wrap:wrap;align-items:center;order:2;margin-left:auto}aside .foot a{margin:0}
 .two{grid-template-columns:1fr}main{padding:16px}
}
@media print{body *{visibility:hidden}.code,.code *,.rcpt,.rcpt *{visibility:visible}.code{position:absolute;top:20px;left:0;right:0}.rcpt{position:absolute;top:0;left:0;width:80mm;border:0}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ===== 2. SMALL HELPERS ===== */
const $ = s => document.querySelector(s);
const f = id => $('#' + id).value;                       // read an input's value
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); // stop XSS
const cap = s => s[0] + s.slice(1).toLowerCase();
// Dates look like "Oct 15, 2026, 4:42 PM" in Manila time
const fmt = t => new Date(t).toLocaleString('en-US', {timeZone:'Asia/Manila', month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'});
const mem = {};                                          // fallback if the browser blocks storage

/* ===== 3. DATA LAYER =====
   PROTOTYPE ONLY: data lives in this browser's localStorage.
   When we host it, only this section is replaced by calls to a real server + database. */
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return mem[k] || null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ mem[k] = v; } }
};
const DB = {
  load(){
    const d = store.get('pf_db') || {users:[], nextId:1, settings:{shop_name:'', shop_address:'', shop_contact:'', expiry_alert_days:30}};
    d.products = d.products || []; d.batches = d.batches || []; d.movements = d.movements || [];   // M2 tables
    d.nextProd = d.nextProd || 1; d.nextBatch = d.nextBatch || 1;
    d.sales = d.sales || []; d.nextSale = d.nextSale || 1; return d;                          // M3 tables
  },
  save(d){ store.set('pf_db', d); }
};
let db = DB.load();
let me = null;                                           // the logged-in user

/* Passwords are salted + hashed (SHA-256 here; the real server will use argon2id/bcrypt). Never stored as plain text. */
const toHex = a => [...new Uint8Array(a)].map(x => x.toString(16).padStart(2,'0')).join('');
const sha = async (t, salt) => toHex(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + t)));
async function makeHash(t){ const s = toHex(crypto.getRandomValues(new Uint8Array(8))); return s + '$' + await sha(t, s); }
async function checkHash(t, h){ const [s, x] = h.split('$'); return await sha(t, s) === x; }
function newCode(){                                      // recovery code like XXXX-XXXX-XXXX-XXXX
  const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = crypto.getRandomValues(new Uint8Array(16));
  return [0,4,8,12].map(i => [...r.slice(i,i+4)].map(x => a[x % a.length]).join('')).join('-');
}
const cleanCode = c => c.toUpperCase().replace(/[^A-Z0-9]/g, '');

/* Rate limit: 5 wrong tries, then wait 1 minute */
const tries = {};
function limited(k){ const t = tries[k]; if (t && Date.now() - t.at > 60000) delete tries[k]; return !!tries[k] && tries[k].n >= 5; }
function failed(k){ const t = tries[k] = tries[k] || {n:0}; t.n++; t.at = Date.now(); }

/* Session: lasts 30 minutes of inactivity */
function setSession(id){ const s = {id, t:Date.now()}; try { sessionStorage.setItem('pf_sess', JSON.stringify(s)); } catch(e){ mem.sess = s; } }
function clearSession(){ try { sessionStorage.removeItem('pf_sess'); } catch(e){} delete mem.sess; }
function getMe(){
  let s; try { s = JSON.parse(sessionStorage.getItem('pf_sess')); } catch(e){ s = mem.sess; }
  if (!s || Date.now() - s.t > 30*60000) { clearSession(); return null; }
  const u = db.users.find(x => x.id === s.id);
  if (!u || u.status !== 'ACTIVE') { clearSession(); return null; }
  setSession(u.id); return u;
}
/* Permission guard: every Owner-only action calls this first (the real server will do the same check). */
function need(role){ if (!me || me.role !== role) throw new Error('Not allowed'); }

/* ===== 4. SHARED UI PIECES ===== */
const LOGO = '<span class="lg"><svg viewBox="0 0 24 24" width="24" height="24" fill="#0a4a48" aria-hidden="true"><ellipse cx="12" cy="16" rx="5" ry="4"/><circle cx="5.5" cy="11" r="2"/><circle cx="9.5" cy="6.5" r="2"/><circle cx="14.5" cy="6.5" r="2"/><circle cx="18.5" cy="11" r="2"/></svg></span>';
const EYE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const field = (id, label, type='text', ph='') => `<label for="${id}">${label}</label><input id="${id}" type="${type}" placeholder="${ph}" autocomplete="off">`;
const noteBox = () => '<p id="note" class="note" role="alert"></p>';
function say(t, good){ const n = $('#note'); n.textContent = t; n.className = 'note ' + (good ? 'ok' : 'err'); }
const enter = fn => `onkeydown="if(event.key==='Enter'){${fn}()}"`;
const authPage = inner => `<div class="center"><div class="brand">${LOGO}PetFeed</div><div class="card" ${enter('window.__enter')}>${inner}</div></div>`;
const resetLink = '<p class="hint" style="text-align:center;margin-top:18px"><a href="#" onclick="resetDemo();return false">Reset prototype data (demo only)</a></p>';
function resetDemo(){
  if (!confirm('This erases ALL prototype data in this browser (users, settings). Continue?')) return;
  try { localStorage.removeItem('pf_db'); } catch(e){} delete mem.pf_db; clearSession(); db = DB.load(); location.hash = '#/'; route();
}
function toggleEye(id){ const i = $('#' + id); i.type = i.type === 'password' ? 'text' : 'password'; }

/* ===== 5. ROUTER (decides which screen to show) ===== */
const BOTH = ['OWNER','STAFF'];
const NAV = [
  {id:'dashboard',     label:'Dashboard',       roles:['OWNER']},
  {id:'sell',          label:'Sell (POS)',      roles:BOTH},
  {id:'history',       label:'Sales History',   roles:BOTH},
  {id:'inventory',     label:'Inventory',       roles:BOTH},
  {id:'notifications', label:'Notifications',   roles:BOTH},
  {id:'users',         label:'User Management', roles:['OWNER']},
  {id:'settings',      label:'Settings',        roles:['OWNER']}
];
function route(){
  const r = location.hash.replace('#/', '');
  if (!db.users.length) return setupPage();                        // first run: no users yet
  me = getMe();
  if (!me) return r === 'forgot' ? forgotPage() : loginPage();     // not logged in: only login / forgot
  if (me.must_change) return forcedPage();                         // must pick a new password first
  const ok = NAV.filter(n => n.roles.includes(me.role)).map(n => n.id).concat('password');
  if (!ok.includes(r)) { location.hash = '#/' + (me.role === 'OWNER' ? 'dashboard' : 'sell'); return; }
  shell(r);
}
window.addEventListener('hashchange', route);

function shell(r){
  rcptSale = null;                                                 // leaving a screen closes any open receipt
  const links = NAV.filter(n => n.roles.includes(me.role)).map(n => `<a href="#/${n.id}" class="${r===n.id?'on':''}">${n.label}</a>`).join('');
  $('#app').innerHTML = `<div class="shell"><aside><div class="brand">${LOGO}PetFeed</div><nav>${links}</nav>
    <div class="foot"><span>Logged in as ${cap(me.role)}</span><a href="#/password" class="${r==='password'?'on':''}">Change Password</a><a href="#" onclick="logout();return false">Logout</a></div></aside><main id="main"></main></div>`;
  (PAGES[r] || (() => {}))();
}
function logout(){ clearSession(); me = null; location.hash = '#/'; route(); }
const soon = (t, m) => () => { $('#main').innerHTML = `<h1>${t}</h1><div class="card" style="margin-top:14px"><p class="mut">This screen is built in milestone ${m}.</p></div>`; };

/* ===== 6. FIRST-RUN OWNER SETUP + RECOVERY CODE ===== */
function setupPage(){
  window.__enter = createOwner;
  $('#app').innerHTML = authPage(`<h1>Welcome to PetFeed</h1><p class="mut">Create the Owner account to get started. There are no default logins.</p>
    ${field('sn','Full name')}${field('su','Username')}${field('sp','Password','password')}<p class="hint">At least 8 characters.</p>${field('sc','Confirm password','password')}
    ${noteBox()}<button class="btn full" onclick="createOwner()">Create Owner account</button>`) + resetLink;
}
async function createOwner(){
  if (db.users.length) return;                                     // setup only works once
  const name = f('sn').trim(), un = f('su').trim(), pw = f('sp');
  if (!name || !un) return say('Full name and username are required.');
  if (!/^[A-Za-z0-9._-]{3,20}$/.test(un)) return say('Username: 3 to 20 letters, numbers, dot, dash or underscore.');
  if (pw.length < 8) return say('Password must be at least 8 characters.');
  if (pw !== f('sc')) return say('The passwords do not match.');
  const code = newCode();
  const u = {id:db.nextId++, full_name:name, username:un, password_hash:await makeHash(pw), role:'OWNER', status:'ACTIVE',
    must_change:false, recovery_hash:await makeHash(cleanCode(code)), last_login:Date.now(), created:Date.now()};
  db.users.push(u); DB.save(db); setSession(u.id);
  codePage(code, () => { location.hash = '#/'; route(); });
}
function codePage(code, next){                                     // shows the recovery code ONCE
  window.__next = next; window.__enter = () => {};
  $('#app').innerHTML = authPage(`<h1>Save your recovery code</h1><p class="mut">This code is the only way to reset the Owner password if you forget it. It is shown once. Save it somewhere safe.</p>
    <div class="code">${code}</div><button class="btn alt full" onclick="window.print()">Print code</button>
    <button class="btn full" onclick="window.__next()">I saved it, continue</button>`);
}

/* ===== 7. LOGIN / FORGOT PASSWORD / FORCED NEW PASSWORD ===== */
function loginPage(){
  window.__enter = doLogin;
  $('#app').innerHTML = `<div class="split"><div class="left"><div class="brand">${LOGO}PetFeed</div>
    <div><h2>Sales and stock, in one place.</h2><p style="opacity:.85;max-width:380px">A web-based point-of-sale and inventory management system for your pet shop.</p>
    <ul><li>Sell at the counter and print receipts</li><li>Track stock, batches, and expiry dates</li><li>Get low stock and expiry notifications</li></ul></div>
    <small style="opacity:.8">PetFeed: A Web-Based Point-of-Sale and Inventory Management System</small></div>
    <div class="right"><div class="box"><div class="card" ${enter('doLogin')}><h1>Welcome back</h1><p class="mut">Log in to your PetFeed account.</p>
    ${field('lu','Username','text','Enter your username')}
    <div style="position:relative">${field('lp','Password','password','Enter your password')}<button class="eye" type="button" aria-label="Show or hide password" onclick="toggleEye('lp')">${EYE}</button></div>
    <p style="text-align:right;margin:8px 0 0"><a href="#/forgot">Forgot password?</a></p>${noteBox()}
    <button class="btn full" onclick="doLogin()">Log in</button>
    <p class="hint" style="text-align:center;margin-top:16px">Accounts are created by the shop Owner. Ask the Owner if you need access or a password reset.</p></div>${resetLink}</div></div></div>`;
}
async function doLogin(){
  if (limited('login')) return say('Too many attempts. Please wait one minute and try again.');
  const un = f('lu').trim().toLowerCase(), user = db.users.find(x => x.username.toLowerCase() === un);
  const good = user && await checkHash(f('lp'), user.password_hash);
  if (!good) { failed('login'); return say('Incorrect username or password.'); }   // same message either way
  if (user.status !== 'ACTIVE') return say('This account is disabled. Ask the Owner for help.');
  delete tries.login; user.last_login = Date.now(); DB.save(db); setSession(user.id);
  location.hash = '#/'; route();
}

let recov = null;                                                  // Owner id after the recovery code was verified
function forgotPage(){
  recov = null; window.__enter = verifyCode;
  $('#app').innerHTML = authPage(`<h1>Forgot your password?</h1><p class="mut">Choose the option that matches your account.</p>
    <div class="staffbox"><b>I am Staff</b><p class="mut">Ask the Owner to reset your password. You will be asked to choose a new one when you log in.</p></div>
    <hr style="border:0;border-top:1px solid var(--line)"><b>I am the Owner</b>${field('fu','Username','text','Enter your username')}
    ${field('fc','Recovery code','text','Enter your recovery code')}<p class="hint">Keep your recovery code somewhere safe. Only the Owner should have it.</p>${noteBox()}
    <button class="btn full" onclick="verifyCode()">Verify code</button><p style="text-align:center;margin:16px 0 0"><a href="#/">Back to login</a></p>`);
}
async function verifyCode(){
  if (limited('recovery')) return say('Too many attempts. Please wait one minute and try again.');
  const un = f('fu').trim().toLowerCase(), u = db.users.find(x => x.username.toLowerCase() === un && x.role === 'OWNER');
  if (!u || !u.recovery_hash || !(await checkHash(cleanCode(f('fc')), u.recovery_hash))) { failed('recovery'); return say('The username or recovery code is incorrect.'); }
  recov = u.id; window.__enter = saveRecovered;
  $('#app').innerHTML = authPage(`<h1>Set a new password</h1>${field('np','New password','password','Enter a new password')}<p class="hint">At least 8 characters.</p>
    ${field('nc','Confirm new password','password','Enter the new password again')}${noteBox()}<button class="btn full" onclick="saveRecovered()">Save and continue</button>`);
}
async function saveRecovered(){
  const u = db.users.find(x => x.id === recov); if (!u) return forgotPage();
  if (f('np').length < 8) return say('Password must be at least 8 characters.');
  if (f('np') !== f('nc')) return say('The passwords do not match.');
  const code = newCode();                                          // a NEW recovery code replaces the old one

const CATS = ['Pet Food','Accessories and Toys','Grooming and Health','Pet Supplies'];
const peso = n => '₱' + Number(n).toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2});
const todayStr = () => new Date().toLocaleDateString('en-CA', {timeZone:'Asia/Manila'});            // YYYY-MM-DD, Manila
const dayDiff = d => Math.round((Date.parse(d + 'T00:00:00Z') - Date.parse(todayStr() + 'T00:00:00Z')) / 864e5);
const dfmt = d => d ? new Date(d + 'T00:00:00Z').toLocaleDateString('en-US', {timeZone:'UTC', month:'short', day:'numeric', year:'numeric'}) : 'None';
const isExp = b => !!b.expiry && dayDiff(b.expiry) < 0;                                        // expired = date is before today
const SPILL = {'In stock':'g', 'Low stock':'a', 'Expiring soon':'r', 'Expired':'x', 'Out of stock':''};

/* Stock numbers + status for one product. Order of rules: Out of stock, Expired, Expiring soon, Low stock, In stock.
   'Expired' shows only when there is still SELLABLE stock next to an expired batch. */
function stockInfo(p){
  const bs = db.batches.filter(b => b.product_id === p.id && b.qty > 0), ok = bs.filter(b => !isExp(b));
  const sum = a => a.reduce((s, b) => s + b.qty, 0), total = sum(bs), sellable = sum(ok);
  const soon = ok.some(b => b.expiry && dayDiff(b.expiry) <= db.settings.expiry_alert_days);
  const nearest = bs.filter(b => b.expiry).map(b => b.expiry).sort()[0] || null;
  const status = sellable === 0 ? 'Out of stock' : bs.some(isExp) ? 'Expired' : soon ? 'Expiring soon' : sellable <= p.low_level ? 'Low stock' : 'In stock';
  return {bs, total, sellable, nearest, status};
}
function logMove(pid, bid, type, qty, reason, note){
  db.movements.push({id:db.movements.length + 1, product_id:pid, batch_id:bid, type, qty, reason:reason || '', note:note || '', user_id:me.id, at:Date.now()});
}
/* Take stock out, earliest expiry first (FEFO). M3 will reuse this for sales. */
function deduct(p, qty, type, reason, note, sellableOnly){
  let left = qty;
  const bs = db.batches.filter(b => b.product_id === p.id && b.qty > 0 && (!sellableOnly || !isExp(b)))
    .sort((a, b) => (a.expiry || '9999').localeCompare(b.expiry || '9999') || a.id - b.id);
  for (const b of bs){ if (!left) break; const t = Math.min(left, b.qty); b.qty -= t; left -= t; logMove(p.id, b.id, type, -t, reason, note); }
}

function doAdjust(){
  need('OWNER');
  const p = db.products.find(x => x.id === Number(f('jp'))), q = Number(f('jq')), r = f('jr'), n = f('jn').trim();
  if (!p) return say('Choose a product.');
  if (!Number.isInteger(q) || q === 0) return say('Enter a whole number that is not 0, like -1 or 2.');
  if (r === 'Other' && !n) return say('Add a short note when the reason is Other.');
  if (q < 0){                                                      // remove stock: earliest expiry first, never below 0
    const total = stockInfo(p).total;
    if (-q > total) return say(`You cannot remove more than the ${total} units in stock.`);
    deduct(p, -q, 'ADJUST', r, n, false);
  } else {                                                         // add stock: goes onto the newest batch
    let b = db.batches.filter(x => x.product_id === p.id).sort((a, c) => c.id - a.id)[0];
    if (!b){ b = {id:db.nextBatch++, product_id:p.id, batch_no:'ADJ-' + p.id, qty:0, expiry:null, created:Date.now()}; db.batches.push(b); }
    b.qty += q; logMove(p.id, b.id, 'ADJUST', q, r, n);
  }

function tabExpiry(){
  const own = me.role === 'OWNER', al = db.settings.expiry_alert_days;

  const ex = rows.filter(r => r.d < 0), soon = rows.filter(r => r.d >= 0 && r.d <= al), shown = expF === 'exp' ? ex : expF === 'soon' ? soon : rows;
  const chip = (k, l) => `<button class="btn ${expF===k?'':'alt'}" style="padding:8px 14px" onclick="expF='${k}';tabExpiry()">${l}</button>`;
  $('#tab').innerHTML = `<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">${chip('all','All batches')}${chip('exp',`Expired (${ex.length})`)}${chip('soon',`Expiring soon (${soon.length})`)}</div>
    <div class="card tbl"><table><thead><tr><th>Product</th><th>Batch</th><th>Units</th><th>Expiry date</th><th>Status</th><th>Action</th></tr></thead><tbody>${shown.length ? shown.map(({b, p, d}) =>
    `<tr><td><b>${esc(p ? p.name : '')}</b></td><td>${esc(b.batch_no)}</td><td>${b.qty}</td><td>${dfmt(b.expiry)}</td><td>${d < 0 ? '<span class="pill x">Expired</span>' : d <= al ? `<span class="pill r">Expiring soon</span> ${d} days` : `<span class="pill g">OK</span> ${d} days`}</td>
    <td>${d < 0 && own ? `<button class="btn danger" style="padding:8px 14px" onclick="writeOff(${b.id})">Write off stock</button>` : ''}</td></tr>`).join('') : '<tr><td colspan="6" class="mut">No batches to show.</td></tr>'}</tbody></table></div>`;
}
function writeOff(id){
  need('OWNER');
  const b = db.batches.find(x => x.id === id);
  if (!b || !isExp(b) || b.qty < 1) return;                        // only expired batches can be written off
  const p = db.products.find(x => x.id === b.product_id);
  if (!confirm(`Write off ${b.qty} units of ${p.name} (batch ${b.batch_no})? This cannot be undone.`)) return;
  logMove(p.id, b.id, 'WRITE_OFF', -b.qty, 'Expired', ''); b.qty = 0; DB.save(db); tabExpiry();
}

/* --- Sample data (Owner, only when there are no products): the items from the mockup --- */
function loadSample(){
  need('OWNER'); if (db.products.length) return;
  const S = [['Dog Food 1kg',0,185,5,[['B-101',14,'2026-11-30'],['B-102',10,'2027-03-15']]], ['Cat Food Pouch',0,32,10,[['B-095',60,'2027-01-12']]], ['Chew Toy',1,95,5,[['B-001',15]]],
    ['Cat Litter 5L',3,260,5,[['B-002',9]]], ['Pet Shampoo 250ml',2,140,5,[['B-088',3,'2027-02-02']]], ['Dog Leash',1,120,5,[['B-003',12]]], ['Puppy Food 500g',0,98,5,[['B-090',18,'2026-10-28']]],
    ['Dog Biscuits 300g',0,75,5,[['B-084',11,'2026-11-04']]], ['Rabbit Pellets 1kg',0,150,5,[['B-077',6,'2026-10-12']]], ['Fish Food 50g',3,45,5,[['B-070',2]]]];
  S.forEach(([name, c, price, low, bs]) => {
    const p = {id:db.nextProd++, name, category:CATS[c], price, low_level:low, barcode:''}; db.products.push(p);
    bs.forEach(([bn, q, ex]) => { const b = {id:db.nextBatch++, product_id:p.id, batch_no:bn, qty:q, expiry:ex || null, created:Date.now()}; db.batches.push(b); logMove(p.id, b.id, 'STOCK_IN', q, 'Sample data', ''); });
  });
  DB.save(db); inventoryPage();
}

/* ===== 9c. SELL (POS), RECEIPTS, SALES HISTORY (M3) ===== */
let cart = [], sellQ = '', sellCat = '', payM = 'CASH', recvAmt = '', rcptSale = null, rcptBack = 'sell', hPer = 'today', hPay = '', hQ = '', hSel = null;
const cents = x => Math.round(x * 100), money = c => peso(c / 100);       // money is handled in centavos to avoid rounding errors
const sellableOf = p => stockInfo(p).sellable;
const cartTotal = () => cart.reduce((s, l) => { const p = db.products.find(x => x.id === l.pid); return s + (p ? cents(p.price) * l.qty : 0); }, 0);

function sellPage(){
  if (rcptSale) return receiptPage();
  $('#main').innerHTML = `<div class="two sellg"><section><div class="hd"><h1>Sell</h1><input id="sq" style="max-width:340px" placeholder="Search product name or scan barcode" value="${esc(sellQ)}" oninput="sellQ=this.value;drawGrid()" onkeydown="if(event.key==='Enter')scanCode()"></div>
    <div id="chips"></div><div id="grid"></div></section><section id="cart" class="card"></section></div>`;
  drawGrid(); drawCart();
}
function drawGrid(){
  $('#chips').innerHTML = `<div class="chips">${['', ...CATS].map(c => `<button class="chip ${sellCat===c?'on':''}" onclick="sellCat='${c}';drawGrid()">${c || 'All'}</button>`).join('')}</div>`;
  const q = sellQ.trim().toLowerCase();
  const ps = db.products.filter(p => (!sellCat || p.category === sellCat) && (!q || p.name.toLowerCase().includes(q) || (p.barcode && p.barcode === sellQ.trim())));
  $('#grid').innerHTML = !db.products.length ? '<p class="mut">No products yet. The Owner can add products under Inventory.</p>' : !ps.length ? '<p class="mut">No products match.</p>'
    : `<div class="grid">${ps.map(p => { const n = sellableOf(p), st = n === 0 ? 'color:var(--red)' : n <= p.low_level ? 'color:var(--amb);font-weight:700' : '';
      return `<button class="pc" ${n ? '' : 'disabled'} onclick="addCart(${p.id})"><small>${p.category}</small><b>${esc(p.name)}</b><span class="pr">${peso(p.price)}</span><div class="hint" style="${st}">${n === 0 ? 'Out of stock' : n <= p.low_level ? 'Low stock: ' + n + ' left' : n + ' in stock'}</div></button>`; }).join('')}</div>`;
}
function scanCode(){                                                     // a barcode scanner types the code and presses Enter
  const p = db.products.find(x => x.barcode && x.barcode === sellQ.trim());
  if (p){ addCart(p.id); sellQ = ''; $('#sq').value = ''; drawGrid(); }
}
function addCart(pid){
  const p = db.products.find(x => x.id === pid); if (!p) return;
  const l = cart.find(x => x.pid === pid);
  if ((l ? l.qty : 0) >= sellableOf(p)) return;                         // never more than the sellable stock
  l ? l.qty++ : cart.push({pid, qty:1}); drawCart();
}
function qty(pid, d){
  const l = cart.find(x => x.pid === pid), p = db.products.find(x => x.id === pid); if (!l || !p) return;
  const n = l.qty + d;
  if (n < 1) cart = cart.filter(x => x !== l); else if (n <= sellableOf(p)) l.qty = n;
  drawCart();
}
function drawCart(){
  const rows = cart.map(l => ({l, p:db.products.find(x => x.id === l.pid)})).filter(x => x.p), cash = payM === 'CASH';
  $('#cart').innerHTML = `<div class="hd" style="margin-bottom:6px"><h2>Current Sale</h2>${cart.length ? '<a href="#" onclick="cart=[];drawCart();return false">Clear cart</a>' : ''}</div>
    ${rows.length ? rows.map(({l, p}) => `<div class="ln"><div><b>${esc(p.name)}</b><div class="hint">${peso(p.price)} each</div></div><div class="qty"><button aria-label="Remove one" onclick="qty(${p.id},-1)">−</button><b>${l.qty}</b><button aria-label="Add one" onclick="qty(${p.id},1)">+</button></div><b style="text-align:right">${money(cents(p.price) * l.qty)}</b></div>`).join('') : '<p class="mut">Tap a product to add it to the sale.</p>'}
    <hr style="border:0;border-top:1px solid var(--line)"><div class="kv"><span>Total</span><b style="font-size:28px">${money(cartTotal())}</b></div>
    <label>Payment method</label><div class="seg"><button class="${cash ? 'on' : ''}" onclick="payM='CASH';drawCart()">Cash</button><button class="${cash ? '' : 'on'}" onclick="payM='DIGITAL';drawCart()">GCash / Card</button></div>
    ${cash ? `<label for="rc">Amount received</label><input id="rc" type="number" min="0" step="0.01" value="${esc(recvAmt)}" oninput="recvAmt=this.value;drawChange()"><div class="chg"><span>Change</span><span id="chg"></span></div>`
      : `<label for="pt">Paid with</label><select id="pt"><option>GCash</option><option>Card</option></select>${field('pf', 'Reference number', 'text', 'Enter the reference number')}`}
    ${noteBox()}<button class="btn full" onclick="completeSale()" ${rows.length ? '' : 'disabled'}>Complete sale and show receipt</button>`;
  drawChange();
}
function drawChange(){
  const el = $('#chg'); if (!el) return;
  const d = cents(Number(recvAmt || 0)) - cartTotal(); el.textContent = recvAmt !== '' && d >= 0 ? money(d) : '—';
}
function completeSale(){
  if (!cart.length) return say('Add at least one product.');
  const lines = []; let total = 0;
  for (const l of cart){                                                // re-check stock at the moment of sale
    const p = db.products.find(x => x.id === l.pid); if (!p) return say('A product in the cart no longer exists.');
    const av = sellableOf(p); if (l.qty > av) return say(`Only ${av} of ${p.name} left in sellable stock. Update the cart.`);
    lines.push({product_id:p.id, name:p.name, unit_price:p.price, qty:l.qty, line_total:cents(p.price) * l.qty / 100}); total += cents(p.price) * l.qty;
  }
  let method = 'Cash', recv = total, ref = '';
  if (payM === 'CASH'){ recv = cents(Number(f('rc'))); if (f('rc') === '' || recv < total) return say('Amount received must be at least the total.'); }
  else { method = f('pt'); ref = f('pf').trim(); if (!ref) return say('Enter the GCash or card reference number.'); }
  const snap = JSON.stringify(db);                                      // all-or-nothing: restore everything if anything fails
  try {
    const n = db.nextSale++, sale = {id:n, receipt_no:'R-' + String(n).padStart(6, '0'), at:Date.now(), user_id:me.id, sold_by:me.full_name, items:lines,
      total:total / 100, method, amount_received:recv / 100, change:(recv - total) / 100, reference:ref};
    lines.forEach(ln => deduct(db.products.find(x => x.id === ln.product_id), ln.qty, 'SALE', sale.receipt_no, '', true));
    db.sales.push(sale); DB.save(db); cart = []; recvAmt = ''; rcptSale = sale; rcptBack = 'sell'; sellPage();
  } catch (e) { db = JSON.parse(snap); DB.save(db); me = db.users.find(u => u.id === me.id); say('The sale failed and nothing was saved. Please try again.'); }
}

/* --- Receipt (also used for reprints) --- */
function receiptHTML(s){
  const st = db.settings, row = (a, b) => `<div class="r"><span>${a}</span><span>${b}</span></div>`;
  return `<div class="rcpt"><div style="text-align:center"><b style="font-size:15px">${esc(st.shop_name || 'Shop Name')}</b><br>${esc(st.shop_address || 'Shop Address')}<br>${esc(st.shop_contact || 'Contact Number')}</div><hr>
    ${row('Receipt No.', s.receipt_no)}${row('Date', fmt(s.at))}${row('Sold by', esc(s.sold_by))}<hr>
    ${s.items.map(i => row(`${esc(i.name)} ${i.qty} x ${i.unit_price.toFixed(2)}`, i.line_total.toFixed(2))).join('')}<hr>
    <div class="r" style="font-size:15px"><b>TOTAL</b><b>${peso(s.total)}</b></div>${row('Payment', s.method)}
    ${s.method === 'Cash' ? row('Received', peso(s.amount_received)) + row('Change', peso(s.change)) : row('Reference', esc(s.reference))}<hr><div style="text-align:center">Thank you for shopping!</div></div>`;
}
function receiptPage(){
  const s = rcptSale, back = rcptBack === 'sell';
  $('#main').innerHTML = `<h1>Receipt</h1><p class="mut">${back ? `Sale ${s.receipt_no} is complete.${s.method === 'Cash' ? ' Change due: ' + peso(s.change) + '.' : ''}` : 'Reprint of sale ' + s.receipt_no + '.'}</p>
    <div style="display:flex;gap:24px;flex-wrap:wrap;margin-top:14px;align-items:flex-start">${receiptHTML(s)}<div style="width:300px;max-width:100%"><button class="btn full" style="margin-top:0" onclick="window.print()">Print receipt</button>
    <button class="btn alt full" onclick="closeReceipt()">${back ? 'New sale' : 'Back to sales history'}</button><p class="hint">The shop name, address, and contact number at the top come from Settings, under Shop information.</p></div></div>`;
}
function closeReceipt(){ rcptSale = null; rcptBack === 'sell' ? sellPage() : historyPage(); }

/* --- Sales History (Staff see only their own sales; Owner sees all) --- */
function historyPage(){
  if (rcptSale) return receiptPage();
  $('#main').innerHTML = `<div class="two sellg" style="grid-template-columns:1fr 340px"><section><h1 style="margin-bottom:16px">Sales History</h1><div id="hcards"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px"><input id="hq" style="max-width:200px" placeholder="Search receipt no." value="${esc(hQ)}" oninput="hQ=this.value;drawHist()"><span id="hf" class="chips" style="margin:0"></span></div>
    <div id="hlist" class="card tbl"></div></section><section id="hside"></section></div>`;
  drawHist();
}
function drawHist(){
  const own = me.role === 'OWNER', day = t => new Date(t).toLocaleDateString('en-CA', {timeZone:'Asia/Manila'}), today = todayStr();
  const wk = new Date(today + 'T00:00:00Z'); wk.setUTCDate(wk.getUTCDate() - ((wk.getUTCDay() + 6) % 7)); const weekStart = wk.toISOString().slice(0, 10);   // week starts Monday
  const mine = db.sales.filter(s => own || s.user_id === me.id).slice().reverse(), sum = a => a.reduce((t, s) => t + cents(s.total), 0);
  const td = mine.filter(s => day(s.at) === today), cash = td.filter(s => s.method === 'Cash'), dig = td.filter(s => s.method !== 'Cash');
  const card = (t, a) => `<div class="card"><span class="mut">${t}</span><b>${money(sum(a))}</b><span class="hint">${a.length} transaction${a.length === 1 ? '' : 's'}</span></div>`;
  $('#hcards').innerHTML = `<div class="cards3">${card('Sales today', td)}${card('Cash', cash)}${card('GCash / Card', dig)}</div>`;
  $('#hf').innerHTML = [['today','Today'], ['week','This week'], ['month','This month']].map(([k, l]) => `<button class="chip ${hPer===k?'on':''}" onclick="hPer='${k}';drawHist()">${l}</button>`).join('')
    + `<select style="width:auto" onchange="hPay=this.value;drawHist()"><option value="">All payments</option>${['Cash','GCash','Card'].map(m => `<option ${hPay===m?'selected':''}>${m}</option>`).join('')}</select>`;
  const rows = mine.filter(s => (hPer === 'today' ? day(s.at) === today : hPer === 'week' ? day(s.at) >= weekStart : day(s.at).slice(0, 7) === today.slice(0, 7))
    && (!hPay || s.method === hPay) && (!hQ.trim() || s.receipt_no.toLowerCase().includes(hQ.trim().toLowerCase())));
  $('#hlist').innerHTML = rows.length ? `<table><thead><tr><th>Receipt No.</th><th>Date and time</th><th>Items</th><th>Payment</th><th>Total</th><th></th></tr></thead><tbody>${rows.map(s =>
    `<tr class="row ${s.id===hSel?'sel':''}" onclick="hSel=${s.id};drawHist()"><td><b>${s.receipt_no}</b></td><td>${fmt(s.at)}</td><td>${s.items.length} item${s.items.length === 1 ? '' : 's'}</td><td>${s.method}</td><td><b>${peso(s.total)}</b></td><td><a href="#" onclick="hSel=${s.id};drawHist();return false">View</a></td></tr>`).join('')}</tbody></table>`
    : '<p class="mut" style="padding:24px">No sales found for these filters.</p>';
  const s = mine.find(x => x.id === hSel);
  $('#hside').innerHTML = !s ? '' : `<div class="card"><h2>Sale ${s.receipt_no}</h2><p class="mut">${fmt(s.at)} · Sold by ${esc(s.sold_by)}</p><hr style="border:0;border-top:1px solid var(--line)">
    ${s.items.map(i => `<div class="kv"><b>${esc(i.name)} <span class="mut" style="font-weight:400">× ${i.qty}</span></b><b>${peso(i.line_total)}</b></div>`).join('')}<hr style="border:0;border-top:1px solid var(--line)">
    <div class="kv"><span>Total</span><b>${peso(s.total)}</b></div><div class="kv"><span>Payment</span><b>${s.method}</b></div>
    ${s.method === 'Cash' ? `<div class="kv"><span>Amount received</span><b>${peso(s.amount_received)}</b></div><div class="kv"><span>Change</span><b>${peso(s.change)}</b></div>` : `<div class="kv"><span>Reference</span><b>${esc(s.reference)}</b></div>`}
    <button class="btn full" onclick="rcptSale=db.sales.find(x=>x.id===${s.id});rcptBack='history';historyPage()">Reprint receipt</button></div>`;
}

/* ===== 10. START ===== */
route();
</script>
